# Load with a2enconf apache-cuotas after enabling proxy and proxy_http.
# Uses the existing Apache listener; does not change PolicyD /webui/.
# Backend always stays on loopback. Browser URL must end in /cuotas/.
RedirectMatch 302 "^/cuotas$" "/cuotas/"
ProxyPass "/cuotas/" "http://127.0.0.1:8787/" connectiontimeout=5 timeout=600
ProxyPassReverse "/cuotas/" "http://127.0.0.1:8787/"

# Preserve the browser host only for this route, so CSRF origin checks work
# on each server without embedding an IP address in the application config.
<Location "/cuotas/">
    ProxyPreserveHost On
</Location>
